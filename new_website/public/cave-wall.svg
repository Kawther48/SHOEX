			<feOffset dy="14" result="offset"/>
			<feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
			<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
